<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Invoice | Jayakesh Kerala Hair Oil</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    :root {
      --green: #0a3416;
      --ink: #14261a;
      --muted: #556452;
      --line: #dfe5dc;
      --cream: #fbf8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    .toolbar {
      max-width: 820px;
      margin: 0 auto 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .8rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .68rem 1.25rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: .84rem;
      text-decoration: none;
      border: 1px solid var(--green);
      cursor: pointer;
    }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-outline { background: #fff; color: var(--green); }
    .sheet {
      max-width: 820px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      padding: 2.5rem;
      border: 1px solid var(--line);
      box-shadow: 0 22px 48px -32px rgba(10, 52, 22, .25);
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--green);
      flex-wrap: wrap;
    }
    .brand img { height: 42px; width: auto; display: block; margin-bottom: .5rem; }
    .inv-badge {
      display: inline-block;
      background: #e1f5d6;
      color: #14591d;
      font-weight: 800;
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .28rem .7rem;
      border-radius: 999px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin: 1.6rem 0;
    }
    @media (max-width: 600px) {
      .sheet { padding: 1.4rem; }
      .meta-grid { grid-template-columns: 1fr; }
    }
    .lbl {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: .3rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }
    th {
      text-align: left;
      font-size: .74rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      padding: .75rem .6rem;
      border-bottom: 2px solid var(--line);
    }
    td {
      padding: .9rem .6rem;
      border-bottom: 1px solid var(--line);
      font-size: .95rem;
    }
    th:last-child, td:last-child { text-align: right; }
    .totals {
      margin-left: auto;
      width: min(320px, 100%);
      display: grid;
      gap: .45rem;
      font-size: .95rem;
    }
    .totals .r { display: flex; justify-content: space-between; }
    .totals .grand {
      border-top: 2px solid var(--green);
      padding-top: .65rem;
      margin-top: .3rem;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--green);
    }
    .foot {
      margin-top: 2.2rem;
      padding-top: 1.1rem;
      border-top: 1px dashed var(--line);
      font-size: .82rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .5rem;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none !important; }
      .sheet { box-shadow: none; border: 0; padding: 0; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="btn btn-outline" href="index.html#/orders">← Back to Store</a>
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>

  <main class="sheet" id="invoiceRoot">
    <p style="text-align:center;color:var(--muted);padding:2rem 0">Loading order invoice...</p>
  </main>

  <script src="config.js"></script>
  <script>
    (function () {
      const CFG = window.JAYAKESH_CONFIG || {};
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const money = (n) => (n === null || n === undefined ? "To confirm" : "₹" + Math.round(Number(n)).toLocaleString("en-IN"));

      function decodeToken(tok) {
        try {
          const b64 = tok.replace(/-/g, "+").replace(/_/g, "/");
          const pad = b64 + "===".slice((b64.length + 3) % 4);
          const bin = atob(pad);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const d = JSON.parse(new TextDecoder().decode(bytes));
          return {
            id: d.id,
            createdAt: d.dt,
            paymentMethod: d.pm,
            utr: d.utr || "",
            coupon: d.cp || "",
            items: (d.it || []).map((x) => ({ name: x.n, size: x.s, qty: x.q, price: x.p })),
            totals: { subtotal: d.sub, discount: d.disc, shipping: d.ship, codFee: d.cod, total: d.tot },
            customer: { name: d.c.n, phone: d.c.p, email: d.c.e, address: d.c.a, city: d.c.ct, state: d.c.st, pincode: d.c.pin }
          };
        } catch (e) {
          return null;
        }
      }

      const params = new URLSearchParams(location.search);
      const tok = params.get("d");
      const oid = params.get("order");
      let order = tok ? decodeToken(tok) : null;

      if (!order) {
        try {
          const list = JSON.parse(localStorage.getItem("jk-my-orders") || "[]");
          order = oid ? list.find((o) => o.id === oid) : list[0];
        } catch (e) {}
      }

      const root = document.getElementById("invoiceRoot");
      if (!order) {
        root.innerHTML = `<div style="text-align:center;padding:2.5rem 1rem">
          <h2 style="margin:0 0 .6rem">Invoice not found</h2>
          <p style="color:var(--muted);margin-bottom:1.2rem">Open this invoice from your order confirmation screen or the invoice link in your email.</p>
          <a class="btn btn-primary" href="index.html#/shop">Return to Jayakesh Store</a>
        </div>`;
        return;
      }

      document.title = `Invoice ${order.id} | ${CFG.storeName || "Jayakesh"}`;
      const dt = new Date(order.createdAt).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });

      root.innerHTML = `
        <div class="head">
          <div class="brand">
            <img src="assets/logo-rest.png" alt="Jayakesh">
            <div style="font-weight:700">${esc(CFG.storeName || "Jayakesh Kerala Hair Oil")}</div>
            <div style="font-size:.86rem;color:var(--muted)">
              ${esc(CFG.address || "Kerala, India")}
              ${CFG.phone ? ` · ${esc(CFG.phone)}` : ""}
              ${CFG.supportEmail ? `<br>${esc(CFG.supportEmail)}` : ""}
              ${CFG.gstNumber ? `<br>GSTIN: ${esc(CFG.gstNumber)}` : ""}
            </div>
          </div>
          <div style="text-align:right">
            <span class="inv-badge">Order Invoice</span>
            <h1 style="margin:.45rem 0 .2rem;font-size:1.55rem">#${esc(order.id)}</h1>
            <div style="font-size:.86rem;color:var(--muted)">Date: ${esc(dt)}</div>
          </div>
        </div>

        <div class="meta-grid">
          <div>
            <div class="lbl">Billed &amp; Shipped To</div>
            <strong>${esc(order.customer.name)}</strong>
            <div style="font-size:.92rem;color:#33422f;margin-top:.2rem">
              ${esc(order.customer.address)}<br>
              ${esc(order.customer.city)}, ${esc(order.customer.state)} - ${esc(order.customer.pincode)}<br>
              Phone: ${esc(order.customer.phone)}<br>
              Email: ${esc(order.customer.email)}
            </div>
          </div>
          <div>
            <div class="lbl">Payment Information</div>
            <div style="font-size:.92rem">
              <strong>Method:</strong> ${order.paymentMethod === "UPI" ? "UPI / QR Payment" : "Cash on Delivery (COD)"}<br>
              ${order.utr ? `<strong>UPI Ref / UTR:</strong> ${esc(order.utr)}<br>` : ""}
              <strong>Status:</strong> ${order.paymentMethod === "UPI" && order.utr ? "UTR Submitted (Subject to Verification)" : order.paymentMethod === "COD" ? "Payable on Delivery" : "Pending Confirmation"}
            </div>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Item Description</th>
              <th>Pack</th>
              <th>Qty</th>
              <th>Unit Price</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody>
            ${order.items
              .map(
                (x) => `<tr>
                  <td><strong>${esc(x.name)}</strong><br><span style="font-size:.8rem;color:var(--muted)">Handmade Kerala Herbal Hair Oil</span></td>
                  <td>${esc(x.size)}</td>
                  <td>${x.qty}</td>
                  <td>${money(x.price)}</td>
                  <td><strong>${x.price === null ? "—" : money(x.price * x.qty)}</strong></td>
                </tr>`
              )
              .join("")}
          </tbody>
        </table>

        <div class="totals">
          <div class="r"><span>Subtotal</span><span>${money(order.totals.subtotal)}</span></div>
          ${order.totals.discount > 0 ? `<div class="r" style="color:#14591d;font-weight:700"><span>Discount${order.coupon ? ` (${esc(order.coupon)})` : ""}</span><span>−${money(order.totals.discount)}</span></div>` : ""}
          <div class="r"><span>Shipping</span><span>${order.totals.subtotal === null ? "To confirm" : order.totals.shipping === 0 ? "FREE" : money(order.totals.shipping)}</span></div>
          ${order.totals.codFee > 0 ? `<div class="r"><span>COD Handling</span><span>${money(order.totals.codFee)}</span></div>` : ""}
          <div class="r grand"><span>Total Payable</span><span>${money(order.totals.total)}</span></div>
        </div>

        <div class="foot">
          <span>Thank you for choosing Jayakesh — <em>Legacy in every drop.</em></span>
          <span>Computer-generated order invoice · jayakesh.in</span>
        </div>
      `;
    })();
  </script>
</body>
</html>
