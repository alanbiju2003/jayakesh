<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Invoice | Jayakesh Kerala Hair Oil</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    :root { --green: #0a3416; --ink: #14261a; --muted: #556452; --line: #dfe5dc; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; background: #f4efe2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); line-height: 1.5; }
    .toolbar { max-width: 820px; margin: 0 auto 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .btn { background: var(--green); color: #fff; border: 0; padding: .7rem 1.3rem; border-radius: 999px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: .85rem; }
    .btn-outline { background: #fff; color: var(--green); border: 1px solid var(--green); }
    .sheet { max-width: 820px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 2.5rem; box-shadow: 0 18px 40px rgba(0,0,0,.08); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5rem; padding-bottom: 1.5rem; border-bottom: 2px solid var(--green); }
    .top img { height: 46px; width: auto; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 1.5rem 0; }
    h4 { margin: 0 0 .35rem; font-size: .74rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
    th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: .75rem .5rem; border-bottom: 2px solid var(--line); }
    td { padding: .85rem .5rem; border-bottom: 1px solid var(--line); font-size: .95rem; }
    .num { text-align: right; }
    .totals { width: min(320px, 100%); margin-left: auto; }
    .totals .r { display: flex; justify-content: space-between; padding: .35rem 0; font-size: .94rem; }
    .totals .grand { border-top: 2px solid var(--green); margin-top: .4rem; padding-top: .65rem; font-size: 1.18rem; font-weight: 800; color: var(--green); }
    .foot { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); text-align: center; }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none !important; }
      .sheet { box-shadow: none; padding: 1rem; max-width: 100%; }
    }
    @media (max-width: 600px) { .grid2, .top { display: grid; grid-template-columns: 1fr; } .sheet { padding: 1.4rem; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="btn btn-outline" href="/">← Back to Store</a>
    <button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>
  <div class="sheet" id="invoiceSheet">
    <p style="color:var(--muted)">Loading invoice...</p>
  </div>
  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const money = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");
    (async function () {
      const qs = new URLSearchParams(location.search);
      const order = qs.get("order") || "";
      const phone = qs.get("phone") || "";
      const host = document.getElementById("invoiceSheet");
      if (!order) {
        host.innerHTML = "<p>Missing order reference.</p>";
        return;
      }
      try {
        const token = localStorage.getItem("jk_admin_token") || "";
        const res = await fetch(`/api/orders/track?order=${encodeURIComponent(order)}&phone=${encodeURIComponent(phone)}`, {
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Invoice unavailable");
        const o = data.order;
        const s = data.settings || {};
        document.title = `Invoice ${o.order_number} | ${s.store_name || "Jayakesh"}`;

        host.innerHTML = `
          <div class="top">
            <div>
              <img src="/assets/logo-small.png" alt="Jayakesh">
              <div style="margin-top:.5rem;font-weight:700;font-size:1.05rem">${esc(s.store_name || "Jayakesh Kerala Hair Oil")}</div>
              <div style="font-size:.86rem;color:var(--muted)">${esc(s.address || "Kerala, India")}</div>
              ${s.phone ? `<div style="font-size:.86rem;color:var(--muted)">Phone: ${esc(s.phone)} · Email: ${esc(s.support_email || "")}</div>` : ""}
              ${s.gst_number ? `<div style="font-size:.84rem;font-weight:700;margin-top:.2rem">GSTIN: ${esc(s.gst_number)}</div>` : ""}
            </div>
            <div style="text-align:right">
              <div style="font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700">${s.gst_number ? "Tax Invoice" : "Order Invoice"}</div>
              <div style="font-size:1.55rem;font-weight:800;color:var(--green)">#${esc(o.order_number)}</div>
              <div style="font-size:.86rem;color:var(--muted)">Date: ${new Date(o.created_at).toLocaleDateString("en-IN", { dateStyle: "long" })}</div>
              <div style="font-size:.84rem;margin-top:.25rem">Status: <strong style="text-transform:uppercase">${esc(o.order_status)}</strong></div>
            </div>
          </div>

          <div class="grid2">
            <div>
              <h4>Billed &amp; Shipped To</h4>
              <strong>${esc(o.customer_name)}</strong><br>
              ${esc(o.address_line)}${o.landmark ? `, ${esc(o.landmark)}` : ""}<br>
              ${esc(o.city)}, ${esc(o.state)} — <strong>${esc(o.pincode)}</strong><br>
              Phone: ${esc(o.customer_phone)}<br>
              Email: ${esc(o.customer_email)}
            </div>
            <div>
              <h4>Payment &amp; Dispatch Summary</h4>
              <div>Payment Method: <strong>${o.payment_method === "upi" ? "UPI Transfer" : "Cash on Delivery (COD)"}</strong></div>
              <div>Payment Status: <strong style="text-transform:uppercase">${esc(o.payment_status.replace(/_/g, " "))}</strong></div>
              ${o.upi_utr ? `<div>UPI UTR Ref: <strong>${esc(o.upi_utr)}</strong></div>` : ""}
              ${o.courier_name ? `<div>Courier: <strong>${esc(o.courier_name)}</strong></div>` : ""}
              ${o.tracking_number ? `<div>AWB No: <strong>${esc(o.tracking_number)}</strong></div>` : ""}
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Product Description</th>
                <th>Pack Size</th>
                <th class="num">Unit Price</th>
                <th class="num">Qty</th>
                <th class="num">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${(o.items || []).map((it, idx) => `
                <tr>
                  <td>${idx + 1}</td>
                  <td><strong>${esc(it.name)}</strong></td>
                  <td>${esc(it.size || "")}</td>
                  <td class="num">${money(it.price)}</td>
                  <td class="num">${it.qty}</td>
                  <td class="num"><strong>${money(it.price * it.qty)}</strong></td>
                </tr>
              `).join("")}
            </tbody>
          </table>

          <div class="totals">
            <div class="r"><span>Subtotal</span><span>${money(o.subtotal)}</span></div>
            ${o.discount > 0 ? `<div class="r" style="color:#155c1e"><span>Discount ${o.coupon_code ? `(${esc(o.coupon_code)})` : ""}</span><span>−${money(o.discount)}</span></div>` : ""}
            <div class="r"><span>Shipping &amp; Handling</span><span>${o.shipping_fee === 0 ? "FREE" : money(o.shipping_fee)}</span></div>
            ${o.cod_fee > 0 ? `<div class="r"><span>COD Handling</span><span>${money(o.cod_fee)}</span></div>` : ""}
            <div class="r grand"><span>Grand Total</span><span>${money(o.total)}</span></div>
          </div>

          <div class="foot">
            Thank you for choosing <strong>${esc(s.store_name || "Jayakesh Kerala Hair Oil")}</strong> — Handmade with pure herbal ingredients. Computer-generated invoice.
          </div>
        `;
      } catch (err) {
        host.innerHTML = `<p style="color:#b3261e;font-weight:700">${esc(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
