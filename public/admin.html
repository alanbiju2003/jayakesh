<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jayakesh Admin Portal | Orders, Stock &amp; Notifications</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <!-- Login View -->
  <div class="login-wrap" id="loginView">
    <div class="login-card">
      <img src="/assets/logo-small.png" alt="Jayakesh">
      <h1 style="margin:0 0 .3rem;font-size:1.5rem">Store Admin Portal</h1>
      <p style="margin:0 0 1.3rem;color:var(--muted);font-size:.9rem">Sign in to manage orders, customer emails, pricing &amp; live inventory.</p>
      <form id="loginForm" style="display:grid;gap:.9rem">
        <div class="fg">
          <label for="admEmail">Admin Email</label>
          <input class="inp" id="admEmail" name="email" type="email" placeholder="admin@jayakesh.in" value="admin@jayakesh.in" required>
        </div>
        <div class="fg">
          <label for="admPass">Password</label>
          <input class="inp" id="admPass" name="password" type="password" placeholder="Enter admin password" required>
        </div>
        <button class="btn" type="submit" style="padding:.8rem;margin-top:.2rem">Sign In to Dashboard</button>
        <p id="loginErr" style="color:#b3261e;font-size:.85rem;margin:0"></p>
      </form>
      <div style="margin-top:1.2rem;text-align:center;font-size:.82rem">
        <a href="/" style="color:var(--muted)">← Return to Storefront</a>
      </div>
    </div>
  </div>

  <!-- Authenticated App -->
  <div class="layout hidden" id="adminApp">
    <aside class="sidebar">
      <div class="brand">
        <img src="/assets/logo-small.png" alt="Jayakesh">
      </div>
      <nav class="side-nav" id="sideNav">
        <button type="button" data-tab="overview" class="active"><span>📊 Overview</span></button>
        <button type="button" data-tab="orders"><span>📦 Orders</span><span class="pill-cnt hidden" id="navPendingCnt">0</span></button>
        <button type="button" data-tab="products"><span>🧴 Products &amp; Price</span></button>
        <button type="button" data-tab="coupons"><span>🎟️ Coupons</span></button>
        <button type="button" data-tab="reviews"><span>⭐ Reviews</span><span class="pill-cnt hidden" id="navRevCnt">0</span></button>
        <button type="button" data-tab="inquiries"><span>📩 Inquiries</span><span class="pill-cnt hidden" id="navInqCnt">0</span></button>
        <button type="button" data-tab="emails"><span>✉️ Emails &amp; Logs</span></button>
        <button type="button" data-tab="settings"><span>⚙️ Store &amp; Mail Setup</span></button>
      </nav>
      <div class="side-foot">
        <a class="btn btn-outline btn-sm" href="/" target="_blank" style="background:rgba(255,255,255,.1);color:#fff;border:0">↗ View Live Website</a>
        <button type="button" class="btn btn-sm" id="logoutBtn" style="background:rgba(255,255,255,.08);color:#ffb4ab">Sign Out</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div>
          <strong id="tabTitle" style="font-size:1.1rem">Dashboard Overview</strong>
          <span id="liveIndicator" style="margin-left:.6rem;font-size:.75rem;color:#157a2c;font-weight:700">● Live 24/7 Sync</span>
        </div>
        <div style="display:flex;align-items:center;gap:.65rem">
          <button type="button" class="btn btn-outline btn-sm" id="enablePushBtn" title="Enable desktop popup & sound alerts when new orders arrive">🔔 Enable Browser Alerts</button>
          <div class="notif-wrap">
            <button type="button" class="btn btn-outline btn-sm" id="notifBellBtn">
              🔔 Alerts <span class="pill-cnt hidden" id="notifBadge">0</span>
            </button>
            <div class="notif-pop hidden" id="notifDropdown"></div>
          </div>
        </div>
      </header>

      <main class="content">
        <div id="storageBanner" class="banner-warn hidden"></div>
        <div id="tabHost"></div>
      </main>
    </div>
  </div>

  <!-- Order / Email Detail Drawer -->
  <div class="backdrop" id="drawerBackdrop">
    <div class="side-drawer" id="drawerContent"></div>
  </div>

  <div class="toast" id="admToast"></div>
  <script src="/admin.js"></script>
</body>
</html>
